<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Address Print Maker - Legal & Policies</title>
  <link rel="icon" type="image/png" href="app_icon_original.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-black: #231F20;
      --secondary-terracotta: #9B6658;
      --secondary-dark-brown: #5A413C;
      --secondary-peach: #F1BE9F;
      --background: #FAF9F8;
      --surface: #FFFFFF;
      --text-primary: #231F20;
      --text-secondary: #58585B;
      --text-muted: #939597;
      --border: #E7E1DE;
      --gradient-primary: linear-gradient(135deg, #9B6658 0%, #5A413C 100%);
      --shadow-sm: 0 4px 12px rgba(90, 65, 60, 0.05);
      --shadow-md: 0 10px 25px rgba(90, 65, 60, 0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--background);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 32px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .logo-wrapper {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      padding: 8px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--secondary-terracotta);
      background-color: rgba(155, 102, 88, 0.1);
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary-black);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      background: #FAF9F8;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      transition: all 0.25s ease;
      text-align: left;
    }

    .nav-card:hover {
      border-color: var(--secondary-terracotta);
      background: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(155, 102, 88, 0.12);
    }

    .nav-card-info h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-black);
      margin-bottom: 3px;
    }

    .nav-card-info span {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .nav-card-arrow {
      width: 36px;
      height: 36px;
      background: rgba(155, 102, 88, 0.08);
      color: var(--secondary-terracotta);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .nav-card:hover .nav-card-arrow {
      background: var(--gradient-primary);
      color: white;
    }

    .footer {
      margin-top: 36px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-wrapper">
      <img src="app_icon_original.png" alt="Address Print Maker Logo">
    </div>

    <span class="badge">Legal Documentation</span>
    <h1>Address Print Maker</h1>
    <p class="subtitle">Official Privacy Policy & Terms of Service for the mobile application.</p>

    <div class="links-grid">
      <a href="privacy-policy.html" class="nav-card">
        <div class="nav-card-info">
          <h3>Privacy Policy</h3>
          <span>Data collection, device permissions & security</span>
        </div>
        <div class="nav-card-arrow">→</div>
      </a>

      <a href="terms-and-conditions.html" class="nav-card">
        <div class="nav-card-info">
          <h3>Terms & Conditions</h3>
          <span>Usage terms, license & responsibilities</span>
        </div>
        <div class="nav-card-arrow">→</div>
      </a>
    </div>

    <div class="footer">
      &copy; 2026 Address Print Maker. All rights reserved.
    </div>
  </div>

</body>
</html>
